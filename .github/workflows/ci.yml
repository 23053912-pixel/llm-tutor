name: Python Linting & Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Black (Code Formatter Check)
      run: black --check . --exclude='.venv|tests'
      continue-on-error: true

    - name: Run Flake8 (Linter)
      run: flake8 . --count --statistics --exclude=.venv,.git,__pycache__,tests
      continue-on-error: true

    - name: Run Pylint
      run: pylint agent.py capstone_streamlit.py kb_data.py --exit-zero
      continue-on-error: true

    - name: Run MyPy (Type Checker)
      run: mypy . --ignore-missing-imports --exit-zero || true
      continue-on-error: true

    - name: Run isort (Import Sorter Check)
      run: isort --check-only . --skip=.venv,tests
      continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run pytest
      run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=html || true
      continue-on-error: true

    - name: Upload coverage reports to Codecov
      run: |
        if [ -f ./coverage.xml ]; then
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          chmod +x codecov
          ./codecov -f ./coverage.xml || true
        fi
      continue-on-error: true

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety

    - name: Check for security vulnerabilities
      run: safety check --json
      continue-on-error: true
